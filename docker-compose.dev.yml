# Apenas um MySQL local para desenvolvimento e para os testes de integração.
# A aplicação em si NÃO roda em Docker: em produção é um binário estático (CGO_ENABLED=0)
# gerenciado por systemd numa VM Linux ARM64, atrás do Caddy.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: travelu
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
