# Apenas um Postgres local para desenvolvimento. Em produção o banco é o
# Postgres gerenciado do Supabase; a imagem segue a mesma major version.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelu
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d travelu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
